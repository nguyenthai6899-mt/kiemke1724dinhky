<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thống kê sản phẩm</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--act:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mu:#9aa1ab;--bd:#323740;--ac:#5b8def;--act:#0b1220}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mu:#9aa1ab;--bd:#323740;--ac:#5b8def;--act:#0b1220}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
p.sub{color:var(--mu);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.drop{display:block;border:2px dashed var(--bd);border-radius:12px;padding:28px 12px;text-align:center;cursor:pointer;color:var(--mu)}
.drop.over{border-color:var(--ac)}
.drop b{color:var(--tx);display:block;font-size:17px;margin-bottom:4px}
input[type=file]{display:none}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 4px}
select,input[type=search]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
@media(max-width:620px){.row{grid-template-columns:1fr 1fr}}
@media(max-width:380px){.row{grid-template-columns:1fr}}
button{background:var(--ac);color:var(--act);border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mu)}
.tw{overflow:auto;margin-top:10px;max-height:60vh}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th,td{padding:8px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--card);font-size:13px;color:var(--mu);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.msg{font-size:13px;color:var(--mu);margin-top:8px}
.err{color:#dc2626}
.sb{background:transparent;color:var(--ac);border:1px solid var(--bd);padding:0 6px;font-size:12px;margin-left:4px;border-radius:6px;cursor:pointer;font-weight:400}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button.tab{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.tab.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
#qrtab{display:none}
body.tq #qrtab{display:block}
body.tq #result{display:none!important}
.qbox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
#qrpages{overflow:auto;max-height:75vh;background:var(--bg);border-radius:10px}
.qpage{page:qr;width:210mm;height:297mm;box-sizing:border-box;padding:8mm;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(10,1fr);background:#fff;color:#000;margin:0 auto 12px;box-shadow:0 1px 6px rgba(0,0,0,.25);break-after:page;page-break-after:always}
.ql{border:.2mm solid #bbb;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;padding:.6mm .5mm;text-align:center;line-height:1.05;font-family:Arial,sans-serif}
.ql svg{width:15.5mm;height:15.5mm;display:block;flex-shrink:0;margin-bottom:.3mm}
.ql b{font-size:5.5pt;word-break:break-all;display:block}
.ql span{font-size:5.5pt;display:block}
@page qr{size:A4 portrait;margin:0}
.fl input[list]::-webkit-calendar-picker-indicator{opacity:1;display:block;cursor:pointer}
.fl select,.fl input{width:100%;min-width:100px;padding:4px 6px;font-size:13px;margin-top:4px;font-weight:400}
@media print{@page{size:A4 portrait;margin:12mm}.fl{display:none!important}.ec,.sb{display:none!important}.tabs,#qrtab{display:none!important}body.pq main>*:not(#qrtab){display:none!important}body.pq #qrtab{display:block!important}body.pq main{max-width:none;padding:0}body.pq .qctl{display:none!important}body.pq #qrpages{max-height:none;overflow:visible;background:#fff}body.pq .qpage{box-shadow:none;margin:0}html,body{background:#fff!important;color:#000!important;padding:0!important}main{max-width:none;padding:0}.sub,.stats,.card:not(#result),.bar,#q,#cmsg{display:none!important}#result{border:0;padding:0;background:#fff!important}.stat{background:#fff!important;border:1px solid #999}.stat span{color:#333}.tw{max-height:none!important;overflow:visible!important;margin-top:8px}table{min-width:0!important;font-size:11px;color:#000}thead{display:table-header-group}tr{page-break-inside:avoid;break-inside:avoid}th{position:static!important;background:#eee!important;color:#000!important}table{border-collapse:collapse!important}th,td{border:1px solid #555!important;padding:4px 5px}}
.stats{flex-wrap:wrap}
.stat{min-width:140px}
.stat.wide{flex:2 1 260px}
.sst{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 14px;margin-bottom:2px}
.sst div{white-space:nowrap}
.sst span{font-size:14px;color:var(--tx)}
.sst b{display:inline;font-size:15px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Thống kê sản phẩm</h1>
<p class="sub">Tải file Excel hoặc CSV lên, trang sẽ gom thành bảng: Nhóm hàng, Mã sản phẩm, Tên sản phẩm, IMEI, Trạng thái sản phẩm, Số lượng. Dữ liệu chỉ xử lý trên máy bạn.</p>

<div class="card">
  <label class="drop" id="drop" for="file"><b>Chọn tệp Excel / CSV</b>hoặc kéo thả vào đây (.xlsx, .xls, .csv)</label>
  <input type="file" id="file" accept=".xlsx,.xls,.csv,.tsv">
  <div class="msg" id="fname"></div>
  <div class="msg err" id="err"></div>
</div>
